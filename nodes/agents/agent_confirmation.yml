---
id: agent_confirmation
name: Confirmation Classifier
position:
  x: 2600
  y: 200
next-step: cond_confirmation_status
next-error-step: func_releaselock_ttrbm
parameters:
  llm-model-key: 1000299722-yandex_aliceaillmfla-div
  chat-history-limit: 20
  enable-context: true
  stay-in-agent: false
  sequential-tool-calls-limit: 1
  unique-tools-count-limit: 0
  system-promts:
    role: "Ты — аналитик поддержки."
    goal: "Проанализируй ответ партнёра и определи статус решения."
    instructions: |
      ОБЩИЕ ПРАВИЛА:
      - Общайся только на русском языке.

      Статусы:
      - "resolved" — проблема решена, партнёр подтвердил
      - "failed" — проблема не решена, актуальна
      - "more_questions" — партнёр задаёт НОВЫЙ вопрос, не связанный с текущей проблемой
      - "unclear" — неясно

      Важно: если партнёр пишет, что проблема не решена — это "failed", не "more_questions".

      Верни JSON: {"status": "resolved|failed|more_questions|unclear", "reason": "кратко"}
  llm-model-settings:
    temperature: 0.2
    frequency-penalty: 0.0
    presence-penalty: 0.0
    max-tokens: 256
    structured-output-enabled: true
    structured-output-schema:
      type: object
      properties:
        status:
          type: string
          enum: ["resolved", "failed", "more_questions", "unclear"]
        reason:
          type: string
      required:
        - status
        - reason
    verbose-mode: false
  tools: []
  handoff-agents:
    allowed-agent-node-ids: []
    allowed-any: false
  telephony-config:
    enabled: false
  total-response-timeout: null
