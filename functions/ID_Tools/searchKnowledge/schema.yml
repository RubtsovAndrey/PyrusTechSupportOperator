---
id: searchKnowledge
name: searchKnowledge
description: "Finds the knowledge topic that matches a problem description, ranked\
  \ by token overlap. Returns found=false when nothing matches (never guesses), with\
  \ knowledge-base chunks as a hint. Pass topicKey for an exact lookup."
response-description: "With query: { found, source, topics: [{ score, key, description,\
  \ route, componentName }], chunks }. With topicKey, one of three: the article's own\
  \ questions, which must be asked before any solution — { found: true, needsPreQuestions:\
  \ true, preQuestions, solverInstruction: null }; the single step to deliver now —\
  \ { found: true, solverInstruction, followUpQuestion, stepNumber, stepCount, isLastStep,\
  \ preQuestions, onFail, key, componentName }; or nothing left to try — { found: false,\
  \ stepsExhausted: true, onFail }"
parameters:
- name: query
  type: STRING
  required: true
  description: Problem description to search for
  properties: null
  items: null
- name: topicKey
  type: STRING
  required: false
  description: "Exact topic key, when the topic is already known"
  properties: null
  items: null
language: JAVASCRIPT
