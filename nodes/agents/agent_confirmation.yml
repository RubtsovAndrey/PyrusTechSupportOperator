---
id: agent_confirmation
name: Confirmation Agent
position:
  x: 2000
  y: 500
next-step: func_parsejson_confirmation
next-error-step: func_escalate_m9k4j
parameters:
  llm-model-key: 1000299722-yandex_aliceaillmfla-div
  llm-model-settings:
    max-tokens: 256
    temperature: 0.2
    top-p: 1.0
    frequency-penalty: 0.0
    presence-penalty: 0.0
    verbose-mode: false
    structured-output-enabled: false
    structured-output-schema: null
  system-promts:
    role: Ты — аналитик поддержки партнёров пиццерий и кофеен.
    goal: Проанализируй ответ партнёра и определи статус решения.
    instructions: |
      ОБЩИЕ ПРАВИЛА:
      - Общайся только на русском языке.

      Статусы:
      - "resolved" — проблема решена, партнёр подтвердил
      - "failed" — проблема не решена, актуальна
      - "more_questions" — партнёр задаёт НОВЫЙ вопрос, не связанный с текущей проблемой
      - "unclear" — неясно

      Важно: если партнёр пишет, что проблема не решена — это "failed", не "more_questions".

      ВАЖНО: верни ТОЛЬКО JSON без markdown-обёртки (без ```json и ```).
      Верни JSON: {"status": "resolved|failed|more_questions|unclear", "reason": "кратко"}
    query-override: Проанализируй последний ответ партнёра (dialog.incomingText) и
      определи статус решения.
  tools: []
  handoff-agents:
    allowed-any: false
    allowed-agent-node-ids: []
  stay-in-agent: false
  telephony-config: null
  enable-context: true
  chat-history-limit: 10
  sequential-tool-calls-limit: 1
  unique-tools-count-limit: 0
  total-response-timeout: null
