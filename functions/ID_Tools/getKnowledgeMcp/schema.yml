---
id: getKnowledgeMcp
name: getKnowledgeMcp
description: Ищет статьи в Базе Знаний через MCP и возвращает их содержимое с метаданными.
  Используй для поиска решений проблем партнёров.
response-description: "Для обычного внутреннего поиска возвращает { found, articles\
  \ }. Для purpose=routing возвращает только проверенные темы текущего каталога: {\
  \ found, source: prepared-mcp, topics }. purpose=routing_refinement предназначен\
  \ только для узла графа: запрос берётся из контекста, а ноль или несколько подтв\
  ерждённых тем приводят к безопасной передаче. Для topicKey возвращает turnKind=external-knowledge\
  \ с прочитанными разрешёнными статьями либо questions/handover по закрытой policy.\
  \ ID, пространство и проверенная версия источников берутся только из policy-ката\
  лога."
parameters:
- name: query
  type: STRING
  required: true
  description: Описание проблемы для поиска в Базе Знаний.
  properties: null
  items: null
- name: spaceIds
  type: STRING
  required: false
  description: "ID пространств для сужения поиска (через запятую). Если не указано\
    ,ищет только в собственном пространстве сценариев бота."
  properties: null
  items: null
- name: limit
  type: NUMBER
  required: false
  description: Максимальное количество результатов (по умолчанию 3).
  properties: null
  items: null
- name: topicKey
  type: STRING
  required: false
  description: "Ключ выбранной тематики для закрытого поиска по разрешённым источн\
    икам текущего узла. ID статей и пространства берутся только из policy-каталога\
    , не из ответа модели."
  properties: null
  items: null
- name: purpose
  type: STRING
  required: false
  description: "Передай routing только при подборе подготовленной тематики маршрут\
    изатором. В этом режиме поиск ограничен опубликованными статьями нашего простр\
    анства, а в ответ возвращаются только темы, полностью совпадающие с текущим runtime-к\
    аталогом.Если вызов разрешён резервной веткой уже выбранной статьи, текущая ши\
    рокая темаисключается, а повторный поиск допускается только один раз за чат. З\
    начение routing_refinementпринадлежит детерминированному узлу графа: запрос в\
    \ нём строится из контекста задачи,а не заполняется моделью."
  properties: null
  items: null
language: JAVASCRIPT
