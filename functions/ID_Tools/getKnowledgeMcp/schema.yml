---
id: getKnowledgeMcp
name: getKnowledgeMcp
description: Ищет статьи в Базе Знаний через MCP и возвращает их содержимое с метаданными.
  Используй для поиска решений проблем партнёров.
response-description: >-
  Для обычного внутреннего поиска возвращает { found, articles }. Для topicKey возвращает
  управляемый результат: turnKind=external_answer с прочитанными разрешёнными статьями,
  warning и followUpQuestion; либо turnKind=external_no_answer с fallbackQuestions. ID,
  пространство и проверенная версия источников берутся только из policy-каталога.
parameters:
- name: query
  type: STRING
  required: true
  description: Описание проблемы для поиска в Базе Знаний.
  properties: null
  items: null
- name: spaceIds
  type: STRING
  required: false
  description: "ID пространств для сужения поиска (через запятую). Если не указано\
    ,ищет только в собственном пространстве сценариев бота."
  properties: null
  items: null
- name: limit
  type: NUMBER
  required: false
  description: Максимальное количество результатов (по умолчанию 3).
  properties: null
  items: null
- name: topicKey
  type: STRING
  required: false
  description: Ключ выбранной тематики для закрытого поиска по разрешённым источникам текущего узла. ID статей и пространства берутся только из policy-каталога, не из ответа модели.
  properties: null
  items: null
language: JAVASCRIPT
