---
id: matchUnit
name: matchUnit
description: "Находит юнит партнёра в каталоге. Вызывай всегда, когда партнёр назвал город, номер точки или бренд. Инструмент решает сам и возвращает точную строку каталога только тогда, когда ответ однозначен: одно и то же название бывает и у пиццерии, и у кофейни, и тогда он просит уточнить, а не угадывает."
response-description: "{ resolvedFullName: точная строка каталога, копируй её символ в символ — или null, если поиск не пришёл к однозначному ответу; needsBusinessClarification: true, когда одно название есть у двух бизнесов — спроси у партнёра, какой именно; networkPick: true, когда взята первая точка сети; matches: [{ name, business }] — только кандидаты, пока выбор не сделан, они не содержат fullName — никогда не собирай имя из этого списка сам; count: сколько нашлось }"
parameters:
- name: query
  type: STRING
  required: true
  description: "Как партнёр назвал свой юнит — ЕГО словами (например: \"Москва 1-1\", \"додо спб\", \"кофейня на невском\"). НЕ добавляй слов, которых он не говорил: \"пиццерия\" или \"кофейня\" от тебя — это выбор бизнеса за партнёра, и он будет проигнорирован."
  properties: null
  items: null
- name: scope
  type: STRING
  required: false
  description: "\"unit\" (по умолчанию) — обращение по одной точке. \"network\" — партнёр пишет от лица всей сети и номера точки у него нет; тогда вернётся первая точка этой сети."
  properties: null
  items: null
language: JAVASCRIPT
