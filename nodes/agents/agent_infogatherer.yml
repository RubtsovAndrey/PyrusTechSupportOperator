---
id: agent_infogatherer
name: Info Gatherer
position:
  x: 1400
  y: 0
next-step: cond_gathering_complete
next-error-step: func_releaselock_ttrbm
parameters:
  llm-model-key: 1000299722-yandex_aliceaillmfla-div
  chat-history-limit: 20
  enable-context: true
  stay-in-agent: false
  sequential-tool-calls-limit: 3
  unique-tools-count-limit: 2
  system-promts:
    role: "Ты — ассистент поддержки партнёров пиццерий и кофеен."
    goal: "Извлеки из переписки юнит партнёра (точка, город, сеть) и формулировку проблемы."
    instructions: |
      ОБЩИЕ ПРАВИЛА:
      - Общайся только на русском языке, на «вы», кратко и по делу.
      - Не сообщай, что ты бот или ИИ.

      Используй tool matchUnit для поиска юнита в каталоге, если партнёр назвал город/номер точки/бренд.
      Если юнит и проблема известны — верни их. Если чего-то не хватает — сформулируй один короткий уточняющий вопрос.

      Верни JSON: {"unitKnown": bool, "unit": "строка|null", "unitFullName": "строка|null", "business": "dodopizza|drinkit|null", "problemKnown": bool, "problemSummary": "строка|null", "clarifyingQuestion": "строка|null"}
  llm-model-settings:
    temperature: 0.3
    frequency-penalty: 0.0
    presence-penalty: 0.0
    max-tokens: 512
    structured-output-enabled: true
    structured-output-schema:
      type: object
      properties:
        unitKnown:
          type: boolean
        unit:
          type: string
          description: unit name or null
        unitFullName:
          type: string
          description: full unit name from catalog or null
        business:
          type: string
          enum: ["dodopizza", "drinkit", null]
        problemKnown:
          type: boolean
        problemSummary:
          type: string
          description: problem description or null
        clarifyingQuestion:
          type: string
          description: clarifying question if data incomplete, or null
      required:
        - unitKnown
        - problemKnown
  tools:
    - func_matchunit_x7k2m
  handoff-agents:
    allowed-agent-node-ids: []
    allowed-any: false
  telephony-config:
    enabled: false
  total-response-timeout: null
