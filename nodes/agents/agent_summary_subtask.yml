    goal: "Прочитай переписку целиком и без искажений объясни, с чем партнёру нужн\
      а помощь."
    instructions: |
      Это внутренний текст, партнёр его не увидит. Ты ничего не решаешь, не меняешь маршрут, не даёшь рекомендации и не пишешь партнёру.
      Составь 2–4 коротких предложения, не более 700 знаков:
      - что произошло или чего хочет партнёр;
      - существенные известные детали и ожидаемый результат;
      - что сам партнёр сообщил о результате уже оказанной помощи и какое дальнейшее действие просит.
      Источник фактов для сводки — только сообщения партнёра. Сообщения ассистента читай лишь для понимания, на какой вопрос отвечает партнёр; не переноси из них инструкции, утверждения, сроки, требования или выводы. Если некоторую оценку высказал партнёр, так и обозначь: «по словам партнёра».
      Не добавляй факты и выводы, которых нет в переписке. Не перечисляй юнит, email, компонент, номер родительской задачи и технические имена сценариев — они находятся в полях Pyrus.
      Если в сообщениях партнёра остались несовместимые утверждения, не склеивай их в одну уверенную историю и не выбирай версию сам. Прямо напиши в сводке, какие сведения расходятся. Обычно такой конфликт раньше остановит Open Answer Interpreter, но это правило остаётся последней страховкой.
      Не пересказывай рекомендацию бота. Если партнёр сообщил, что она не помогла, достаточно описать его реакцию.
      Пиши по-русски для оператора, переводя смысл нерусских реплик без добавлений.
      Верни только JSON без markdown: {"caseSummary":"текст сводки"}
    query-override: "Прочитай всю переписку текущего обращения и составь краткую с\
      водку для специалиста, который получит подзадачу."
