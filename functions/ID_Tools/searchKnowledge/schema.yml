---
id: searchKnowledge
name: searchKnowledge
description: "Ищет в базе знаний тематику, подходящую под описание проблемы. Если\
  \ ничего не подходит, возвращает found=false без кандидатов и никогда не угадыва\
  ет. Когда тематика уже известна, передавай topicKey. Защищённый activeQuestionId\
  \ обрабатывает отдельный Turn Interpreter; Solver не должен угадывать его значен\
  ие."
response-description: "В ответе всегда есть turnKind — он говорит, чем сейчас этот\
  \ виток: choose-branch (при activeQuestionId задай вопрос — следующий ответ обра\
  ботает отдельный Interpreter; иначе передай branch), questions (сформулируй вопр\
  осы по questionSpecs, а без него используй preQuestions), solution (выдай solverInstruction),\
  \ handover (не говори ничего, передачей занимается сценарий). При questions може\
  т прийти reasked: true — эти вопросы уже задавались, а партнёр ответил не на них\
  ; повторять их слово в слово нельзя. При questions поля subtaskEmailRequired и subtaskEmailMissing\
  \ говорят, нужно ли вместе с вопросами запросить email для подзадачи техподдержк\
  и. На query: { found, source, topics: [{ score, key, description, route, componentName\
  \ }] }. На topicKey ветвящаяся статья возвращает один узел: { turnKind, treeNode,\
  \ preQuestions, questionSpecs, answerKeys, branchOptions, activeQuestionId, answerValues,\
  \ refinementAvailable, refinementBranches, solverInstruction, treeEnd }. turnKind=refine-routing\
  \ или refinementAvailable=true разрешает один MCP-поиск более конкретной подгото\
  вленной темы перед резервной передачей оператору. Линейная статья возвращает либ\
  о свои вопросы — { needsPreQuestions: true, preQuestions, answerKeys }, и если answerKeys\
  \ непусты, ответы на эти вопросы верни в поле answers следующим витком, как и дл\
  я ветвящейся статьи; либо один шаг, который надо выдать сейчас — { solverInstruction,\
  \ followUpQuestion, stepNumber, stepCount, isLastStep, onFail }; либо то, что пр\
  обовать больше нечего — { found: false, stepsExhausted: true, onFail }. questionSpecs\
  \ задаёт смысл вопросов, безопасную запасную формулировку, варианты ответа и зап\
  рещённые предположения; формулировку выбери естественную, не меняя этот контракт\
  . При prose: true в solverInstruction лежит статья целиком, возможно с условиями\
  \ внутри: выбери подходящую партнёру часть, а если выбрать нельзя — задай один р\
  азличающий вопрос и верни kind: questions"
parameters:
- name: query
  type: STRING
  required: true
  description: "Описание проблемы, по которому искать тематику."
  properties: null
  items: null
- name: topicKey
  type: STRING
  required: false
  description: "Точный ключ тематики, если тематика уже известна."
  properties: null
  items: null
- name: branch
  type: STRING
  required: false
  description: "Какую ветку текущего узла означает ответ партнёра. Только для ветв\
    ящейся статьи и только после витка, где вернулось turnKind: choose-branch — пе\
    редавай одну из строк branchOptions символ в символ."
  properties: null
  items: null
- name: answers
  type: STRING
  required: true
  description: "Факты, которые партнёр УЖЕ сообщил в этой переписке, в виде JSON:\
    \ {\"ключ\": \"его слова\"}. Ключи — это answerKeys статьи, они перечислены дл\
    я тебя в заметке «Ещё не отвечено» вместе с вопросом, на который каждый из них\
    \ отвечает; всё остальное игнорируется. ОБЯЗАТЕЛЬНО: прочитай всю переписку, в\
    ключая самое первое сообщение, и заполни всё, что в ней уже есть — эти вопросы\
    \ не будут заданы снова, и статья может дойти до конца за один этот виток. Пер\
    едавай {} только если партнёр действительно ещё ничего не сказал. Никогда не в\
    ыдумывай и не угадывай значение: только то, что партнёр написал сам."
  properties: null
  items: null
- name: activeQuestionId
  type: STRING
  required: false
  description: Идентификатор активного вопроса. Заполняется проверенным результатом
    отдельного Turn Interpreter; обычный Solver его не создаёт.
  properties: null
  items: null
- name: answerValue
  type: STRING
  required: false
  description: Одно конечное смысловое значение активного вопроса из проверенного
    Turn Interpreter. Это не имя ветки или следующего узла.
  properties: null
  items: null
- name: evidenceText
  type: STRING
  required: false
  description: Дословный непрерывный фрагмент ТЕКУЩЕГО сообщения партнёра из проверенного
    Turn Interpreter.
  properties: null
  items: null
language: JAVASCRIPT
